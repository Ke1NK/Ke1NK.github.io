<style>
/* Layout: single centered column (max 880px), sticky bar, hero with portrait + KPI row, sections as soft bands */
:root{
  --bg:#F4F6F5; --surface:#FFFFFF; --ink:#121816; --muted:#5B6662; --line:#DDE3E0;
  --accent:#0B7A62; --accent-soft:#E2F1EC; --chip:#EDF1EF;
  --f-display:"Unbounded","Onest",system-ui,sans-serif;
  --f-body:"Onest",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
  --r:18px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0E1312; --surface:#161D1B; --ink:#E9EEEC; --muted:#97A39F; --line:#26302D;
  --accent:#3CC9A3; --accent-soft:#16302A; --chip:#1D2624; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1312; --surface:#161D1B; --ink:#E9EEEC; --muted:#97A39F; --line:#26302D;
  --accent:#3CC9A3; --accent-soft:#16302A; --chip:#1D2624; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.55;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.wrap{max-width:880px;margin:0 auto}
a{color:var(--accent)}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:8px}

.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:color-mix(in srgb,var(--bg) 88%,transparent);
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line);
  margin-left:calc(-1 * max(16px,env(safe-area-inset-left,0px)));margin-right:calc(-1 * max(16px,env(safe-area-inset-right,0px)));
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.bar .wrap{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:12px}
.brand{font-family:var(--f-display);font-weight:500;font-size:15px;letter-spacing:.01em}
.status{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 4px var(--accent-soft)}
.seg{display:inline-flex;background:var(--chip);border-radius:999px;padding:3px;gap:2px}
.seg button{border:0;background:transparent;padding:6px 14px;border-radius:999px;cursor:pointer;font-size:14px;font-weight:500;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgb(0 0 0 / .08)}
.seg button small{font-weight:400;color:var(--muted);margin-left:4px}
.bar-right{display:flex;align-items:center;gap:10px}
@media (max-width:560px){.status span{display:none}}

.hero{padding-block:44px 28px;display:grid;grid-template-columns:200px 1fr;gap:36px;align-items:center}
.portrait{width:200px;aspect-ratio:1;max-width:100%;border-radius:28px;object-fit:cover;background:var(--chip)}
.eyebrow{font-family:var(--f-mono);font-size:12.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--accent);margin:0 0 10px}
h1{font-family:var(--f-display);font-weight:700;font-size:clamp(34px,6vw,54px);line-height:1.02;letter-spacing:-.02em;margin:0 0 14px;text-wrap:balance}
.tagline{font-size:clamp(18px,2.4vw,21px);font-weight:600;margin:0 0 10px;text-wrap:balance}
.lede{color:var(--muted);margin:0;max-width:60ch}
@media (max-width:680px){.hero{grid-template-columns:1fr;text-align:left;gap:22px;padding-block:28px 20px}.portrait{width:132px;border-radius:22px}}

.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:0;border-top:1px solid var(--line);border-bottom:1px solid var(--line);margin-bottom:22px}
.kpi{padding:20px 16px 18px;border-left:1px solid var(--line);min-width:0}
.kpi:first-child{border-left:0;padding-left:0}
.kpi b{display:block;font-family:var(--f-display);font-weight:700;font-size:clamp(24px,3.6vw,34px);color:var(--accent);letter-spacing:-.02em;font-variant-numeric:tabular-nums;line-height:1.1}
.kpi span{display:block;font-size:13px;color:var(--muted);margin-top:6px;line-height:1.35}
@media (max-width:620px){.kpis{grid-template-columns:repeat(2,1fr)}.kpi:nth-child(3){border-left:0;padding-left:0}.kpi:nth-child(-n+2){border-bottom:1px solid var(--line)}}

.contacts{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:8px}
.pill{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 14px;font-size:14px;text-decoration:none;color:var(--ink);cursor:pointer}
.pill.primary{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.pill .k{color:var(--muted);font-size:12.5px}
.pill.primary .k{color:color-mix(in srgb,var(--bg) 70%,transparent)}
.toast{font-size:13px;color:var(--accent);min-height:20px;margin:4px 0 0}

section{padding-block:34px;border-top:1px solid var(--line)}
.sec-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:20px}
h2{font-family:var(--f-display);font-weight:500;font-size:clamp(22px,3vw,28px);letter-spacing:-.01em;margin:0;text-wrap:balance}
.sec-label{font-family:var(--f-mono);font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}

.facts{background:var(--surface);border-radius:var(--r);border:1px solid var(--line)}
.fact{display:grid;grid-template-columns:170px 1fr;gap:16px;padding:16px 22px;border-top:1px solid var(--line)}
.fact:first-child{border-top:0}
.fact dt{color:var(--muted);font-size:14px}
.fact dd{margin:0;min-width:0}
.fact dd strong{font-weight:600}
@media (max-width:560px){.fact{grid-template-columns:1fr;gap:4px;padding:14px 18px}}

.cases{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.case{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px;display:flex;flex-direction:column;gap:10px;min-width:0}
.case .co{font-family:var(--f-mono);font-size:12px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
.case h3{margin:0;font-size:17px;line-height:1.3;font-weight:600;text-wrap:balance}
.case .num{font-family:var(--f-display);font-weight:700;font-size:28px;color:var(--accent);letter-spacing:-.02em;line-height:1}
.case p{margin:0;color:var(--muted);font-size:14.5px}
@media (max-width:760px){.cases{grid-template-columns:1fr}}

.projects{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}.proj{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px;display:flex;flex-direction:column;gap:8px;min-width:0}.proj .meta{font-family:var(--f-mono);font-size:12px;letter-spacing:.05em;text-transform:uppercase;color:var(--accent)}.proj h3{margin:0;font-size:17px;font-weight:600;line-height:1.3}.proj p{margin:0;color:var(--muted);font-size:14.5px}@media (max-width:700px){.projects{grid-template-columns:1fr}}
.roles{display:flex;flex-direction:column;gap:0}
.role{display:grid;grid-template-columns:120px 1fr;gap:20px;padding-block:22px;border-top:1px dashed var(--line)}
.role:first-child{border-top:0;padding-top:4px}
.when{font-family:var(--f-mono);font-size:13px;color:var(--muted);padding-top:3px;font-variant-numeric:tabular-nums}
.role-body{min-width:0}
.role h3{margin:0;font-size:18px;font-weight:600;line-height:1.3}
.role .org{color:var(--muted);font-size:14.5px;margin:2px 0 8px}
.role .sum{margin:0}
.role ul{margin:10px 0 0;padding-left:18px;display:flex;flex-direction:column;gap:6px}
.role li::marker{color:var(--accent)}
.res{margin-top:12px;display:flex;flex-wrap:wrap;gap:6px}
.res span{background:var(--accent-soft);color:var(--ink);font-size:13px;padding:4px 10px;border-radius:999px}
@media (max-width:560px){.role{grid-template-columns:1fr;gap:4px}}

.skills{display:grid;grid-template-columns:repeat(2,1fr);gap:22px}
.skills h3{font-size:14px;font-weight:600;margin:0 0 10px;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips span{background:var(--chip);border-radius:8px;padding:5px 10px;font-size:14px}
@media (max-width:620px){.skills{grid-template-columns:1fr}}

.edu{display:flex;flex-direction:column;gap:10px;margin:0;padding:0;list-style:none}
.edu li{display:grid;grid-template-columns:120px 1fr;gap:20px}
@media (max-width:560px){.edu li{grid-template-columns:1fr;gap:0}}

.cta{background:var(--ink);color:var(--bg);border-radius:24px;padding:30px;margin-block:10px 40px;display:flex;justify-content:space-between;align-items:center;gap:20px;flex-wrap:wrap}
.cta h2{color:var(--bg)}
.cta p{margin:6px 0 0;color:color-mix(in srgb,var(--bg) 70%,transparent)}
.cta .pill{background:transparent;color:var(--bg);border-color:color-mix(in srgb,var(--bg) 35%,transparent)}
.cta .pill .k{color:color-mix(in srgb,var(--bg) 65%,transparent)}
.cta .contacts{margin:0}
footer{color:var(--muted);font-size:13px;padding-bottom:28px}
@media (prefers-reduced-motion:no-preference){.fade{animation:fade .5s ease both}@keyframes fade{from{opacity:.4;transform:translateY(4px)}to{opacity:1;transform:none}}}
</style>
<style>
/* Shared: focus chips + welcome popup. Uses each variant's own tokens. */
.focusbar{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin:0 0 18px;grid-column:1 / -1}
.fb-label{font-size:13px;color:var(--muted);margin-right:4px}
.focusbar button{border:1px solid var(--line);background:transparent;color:var(--ink);border-radius:999px;padding:6px 13px;font-size:13.5px;cursor:pointer}
.focusbar button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.pop{position:fixed;inset:0;z-index:50;display:grid;place-items:center;overflow-y:auto;
  background:rgb(10 12 14 / .45);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
  padding:calc(16px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) calc(16px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
html.pop-open body{overflow:hidden}
.pop-card{position:relative;width:100%;max-width:520px;background:var(--surface,var(--tile,var(--bg)));color:var(--ink);border-radius:28px;padding:30px 24px 24px;
  display:flex;flex-direction:column;align-items:center;text-align:center;gap:12px;box-shadow:0 30px 80px rgb(0 0 0 / .28)}
@media (prefers-reduced-motion:no-preference){.pop-card{animation:popin .35s cubic-bezier(.2,.8,.2,1) both}@keyframes popin{from{transform:translateY(12px) scale(.98);opacity:.6}to{transform:none;opacity:1}}}
.pop-x{position:absolute;top:12px;right:14px;border:0;background:transparent;font-size:24px;line-height:1;color:var(--muted);cursor:pointer;padding:6px;border-radius:8px}
.pop-photo{width:96px;height:96px;border-radius:50%;object-fit:cover;object-position:center 15%}
.pop-name{font-family:var(--f-display);font-weight:700;font-size:26px;letter-spacing:-.01em;margin:4px 0 0}
.pop-sub{margin:0;color:var(--muted);font-size:15px}
.pop-seg{display:inline-flex;background:color-mix(in srgb,var(--ink) 7%,transparent);border-radius:999px;padding:4px;gap:2px;max-width:100%}
.pop-seg button{border:0;background:transparent;color:var(--muted);padding:9px 18px;border-radius:999px;font-size:15px;font-weight:600;cursor:pointer}
.pop-seg button small{font-weight:400;margin-left:4px}
.pop-seg button[aria-pressed="true"]{background:var(--surface,var(--tile,var(--bg)));color:var(--ink);box-shadow:0 1px 4px rgb(0 0 0 / .14)}
.pop-hint{margin:0;color:var(--muted);font-size:14px;max-width:42ch}
.pop-q{margin:8px 0 0;font-weight:700;font-size:16px}
.pop-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;width:100%}
.pop-grid button{border:1.5px solid transparent;background:color-mix(in srgb,var(--ink) 5%,transparent);color:var(--ink);border-radius:18px;padding:14px;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:4px;min-width:0}
.pop-grid button:hover{border-color:var(--line)}
.pop-grid button.on{border-color:var(--accent)}
.pop-grid b{font-size:15.5px;line-height:1.25}
.pop-grid span{font-size:13px;color:var(--muted);line-height:1.35}
@media (max-width:420px){.pop-grid{grid-template-columns:1fr}.pop-seg button{padding:8px 12px;font-size:14px}}
</style>

  en:{sub:"Choose language, format and focus",q:"Who are you hiring for?",min:"min",
      hint:{short:"The essentials for a recruiter: profile, numbers, cases and a one-line view of each role.",full:"Everything above plus responsibilities and results for every role."},
      focus:"Focus",close:"Close",open:"Open CV"},
  ru:{sub:"Выберите язык, формат и направление",q:"Кто вам нужен?",min:"мин",
      hint:{short:"Главное для рекрутера: профиль, цифры, кейсы и по строке на каждую роль.",full:"Всё то же плюс обязанности и результаты по каждой роли."},
      focus:"Направление",close:"Закрыть",open:"Открыть резюме"}
};
const MINS = {short:2, full:5};
let lang = "en", mode = "short", focus = "general";
try { lang = localStorage.getItem("cv-lang") || lang; mode = localStorage.getItem("cv-mode") || mode; focus = localStorage.getItem("cv-focus") || focus; } catch(e) {}
let fromLink = false;
(function(){ const m = location.hash.slice(1).match(/^(en|ru)?-?(general|growth|brand|fintech)?$/);
  if (m && (m[1] || m[2])) { if (m[1]) lang = m[1]; if (m[2]) focus = m[2]; fromLink = !!m[2]; } })();
if (!FOCUS.en[focus]) focus = "general";

const esc = s => s.replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const $ = id => document.getElementById(id);

function render() {
  const base = T[lang], f = FOCUS[lang][focus];
  const d = Object.assign({}, base, {
    tagline: f.tag || base.tagline, lede: f.lede || base.lede,
    kpis: f.k.map(i => base.kpis[i]), cases: f.c.map(i => base.cases[i]), skills: f.s.map(i => base.skills[i])
  });
  document.documentElement.lang = lang;
  document.querySelectorAll("[data-t]").forEach(el => { el.textContent = d[el.dataset.t]; });
  document.querySelectorAll("[data-wa]").forEach(a => a.href = "https://wa.me/77015245180?text=" + encodeURIComponent(base.wa));
  renderFocusBar(); renderPop();
  $("mode-short").textContent = d.short; $("mode-full").textContent = d.full;
  document.querySelectorAll("[data-lang]").forEach(b => b.setAttribute("aria-pressed", b.dataset.lang === lang));
  document.querySelectorAll("[data-mode]").forEach(b => b.setAttribute("aria-pressed", b.dataset.mode === mode));
  $("kpis").innerHTML = d.kpis.map(k => `<div class="kpi"><b>${esc(k[0])}</b><span>${esc(k[1])}</span></div>`).join("");
  $("facts").innerHTML = d.facts.map(f => `<div class="fact"><dt>${esc(f[0])}</dt><dd>${f[1]}</dd></div>`).join("");
  $("cases").innerHTML = d.cases.map(c => `<article class="case"><span class="co">${esc(c.co)}</span><span class="num">${esc(c.num)}</span><h3>${esc(c.h)}</h3><p>${esc(c.p)}</p></article>`).join("");
  $("projects-list").innerHTML = d.projects.map(p => `<article class="proj"><span class="meta">${esc(p.m)}</span><h3>${esc(p.h)}</h3><p>${esc(p.p)}</p></article>`).join("");
  $("roles").innerHTML = d.roles.map(r => `<article class="role fade"><div class="when">${esc(r.y)}</div><div class="role-body">
      <h3>${esc(r.t)}</h3><p class="org">${esc(r.o)}</p>
      ${mode === "short" ? `<p class="sum">${esc(r.s)}</p>` : `<p class="sum">${esc(r.s)}</p><ul>${r.b.map(x => `<li>${esc(x)}</li>`).join("")}</ul>`}
      ${r.r.length ? `<div class="res">${r.r.map(x => `<span>${esc(x)}</span>`).join("")}</div>` : ""}
    </div></article>`).join("");
  $("skillgrid").innerHTML = d.skills.map(g => `<div><h3>${esc(g[0])}</h3><div class="chips">${g[1].map(x => `<span>${esc(x)}</span>`).join("")}</div></div>`).join("");
  $("edu").innerHTML = d.edu.map(e => `<li><span class="when">${esc(e[0])}</span><span>${esc(e[1])}</span></li>`).join("");
}

document.querySelectorAll("[data-lang]").forEach(b => b.addEventListener("click", () => {
  lang = b.dataset.lang; try { localStorage.setItem("cv-lang", lang); } catch(e) {} render();
}));
document.querySelectorAll("[data-mode]").forEach(b => b.addEventListener("click", () => {
  mode = b.dataset.mode; try { localStorage.setItem("cv-mode", mode); } catch(e) {} render();
}));
function copyEmail() {
  const email = "konstantin.kan727@gmail.com";
  const done = ok => { $("toast").textContent = ok ? T[lang].copied : T[lang].copyFail; setTimeout(() => $("toast").textContent = "", 3000); };
  try { navigator.clipboard.writeText(email).then(() => done(true), () => done(false)); } catch(e) { done(false); }
}

function setFocus(v){ focus = v; try { localStorage.setItem("cv-focus", focus); } catch(e) {} render(); }

/* focus chips under the hero */
const fbar = document.createElement("div"); fbar.className = "focusbar"; fbar.setAttribute("role","group");
$("kpis").parentNode.insertBefore(fbar, $("kpis"));
function renderFocusBar(){
  fbar.setAttribute("aria-label", UI[lang].focus);
  fbar.innerHTML = `<span class="fb-label">${esc(UI[lang].focus)}</span>` + Object.keys(FOCUS[lang]).map(k =>
    `<button type="button" id="fb-${k}" data-focus="${k}" aria-pressed="${k===focus}">${esc(FOCUS[lang][k].l)}</button>`).join("");
  fbar.querySelectorAll("[data-focus]").forEach(b => b.onclick = () => setFocus(b.dataset.focus));
}

/* welcome popup */
const photoSrc = (document.querySelector(".portrait, .t-photo img") || {}).src || "";
const pop = document.createElement("div"); pop.className = "pop"; pop.setAttribute("role","dialog"); pop.setAttribute("aria-modal","true");
document.body.appendChild(pop);
function renderPop(){
  if (pop.hidden) return;
  const u = UI[lang];
  pop.innerHTML = `<div class="pop-card">
    <button type="button" class="pop-x" id="pop-x" aria-label="${esc(u.close)}">×</button>
    <img class="pop-photo" src="${photoSrc}" alt="">
    <h2 class="pop-name">${esc(T[lang].name)}</h2>
    <p class="pop-sub">${esc(u.sub)}</p>
    <div class="pop-seg"><button type="button" id="pop-en" data-plang="en" aria-pressed="${lang==='en'}">English</button><button type="button" id="pop-ru" data-plang="ru" aria-pressed="${lang==='ru'}">Русский</button></div>
    <div class="pop-seg"><button type="button" id="pop-short" data-pmode="short" aria-pressed="${mode==='short'}">${esc(T[lang].short)} <small>${MINS.short} ${u.min}</small></button><button type="button" id="pop-full" data-pmode="full" aria-pressed="${mode==='full'}">${esc(T[lang].full)} <small>${MINS.full} ${u.min}</small></button></div>
    <p class="pop-hint">${esc(u.hint[mode])}</p>
    <p class="pop-q">${esc(u.q)}</p>
    <div class="pop-grid">${Object.keys(FOCUS[lang]).map(k => `<button type="button" id="pop-f-${k}" data-pfocus="${k}" class="${k===focus?'on':''}"><b>${esc(FOCUS[lang][k].l)}</b><span>${esc(FOCUS[lang][k].d)}</span></button>`).join("")}</div>
  </div>`;
  pop.querySelectorAll("[data-plang]").forEach(b => b.onclick = () => { lang = b.dataset.plang; try{localStorage.setItem("cv-lang",lang)}catch(e){} render(); });
  pop.querySelectorAll("[data-pmode]").forEach(b => b.onclick = () => { mode = b.dataset.pmode; try{localStorage.setItem("cv-mode",mode)}catch(e){} render(); });
  pop.querySelectorAll("[data-pfocus]").forEach(b => b.onclick = () => { closePop(); setFocus(b.dataset.pfocus); });
  $("pop-x").onclick = closePop;
}
function closePop(){ pop.hidden = true; document.documentElement.classList.remove("pop-open"); try { sessionStorage.setItem("cv-pop","1"); } catch(e) {} }
pop.addEventListener("click", e => { if (e.target === pop) closePop(); });
document.addEventListener("keydown", e => { if (e.key === "Escape" && !pop.hidden) closePop(); });
let seen = false; try { seen = sessionStorage.getItem("cv-pop") === "1"; } catch(e) {}
if (seen || fromLink) pop.hidden = true; else document.documentElement.classList.add("pop-open");

$("copy-email").addEventListener("click", copyEmail);
$("copy-email-2").addEventListener("click", copyEmail);
render();
</script>
